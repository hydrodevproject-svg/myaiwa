<div id="tab-accounting" class="tab-content hidden">
  <div class="grid-2">
    <div class="card stat-card">
      <h3>Status Database</h3>
      <p class="stat-value text-db-status mt-1">Terhubung Aktif</p>
    </div>
    <div class="card stat-card">
      <h3>Modul Aktif</h3>
      <p class="stat-value mt-1">HR & Presensi</p>
    </div>
  </div>

  <div class="card mb-2 mt-2">
    <div class="sheet-section-title mb-1">
      <span class="text-uppercase-label font-700">STATUS JENJANG KARIR</span>
      <span id="user-career-level-badge" class="badge-status-work">JUNIOR</span>
    </div>

    <div class="mt-1 mb-1">
      <small class="instruction-note">Tingkatan Karir Saat Ini</small>
      <strong id="user-career-title" class="hero-user-name">Junior Staff</strong>
    </div>

    <div class="time-stat-pill mt-1 text-left">
      <small>Tunjangan Jabatan Aktif</small>
      <strong id="user-career-allowance-display" class="text-db-status">Rp 0 / bulan</strong>
    </div>
  </div>

  <div class="card mt-2">
    <div class="sheet-section-title mb-2">
      <span class="text-uppercase-label">Finalisasi & Sertifikat KPI Bulanan</span>
      <span id="kpi-verify-status-badge" class="badge-status-work">DRAFT BULAN BERJALAN</span>
    </div>

    <div class="grid-2 gap-sm mb-2">
      <div class="time-stat-pill">
        <small>Skor Akhir KPI</small>
        <strong id="final-kpi-score-display" class="text-accent">0%</strong>
      </div>
      <div class="time-stat-pill">
        <small>Status Performa</small>
        <strong id="final-kpi-grade-display">Kurang</strong>
      </div>
    </div>

    <div id="kpi-crosscheck-box" class="time-stat-pill mb-2 hidden text-left">
      <small class="font-700">CATATAN CROSCHECK / AUDIT:</small>
      <span id="kpi-crosscheck-note-display" class="instruction-note mt-1">-</span>
    </div>

    <div class="grid-2 gap-sm">
      <button type="button" class="btn-primary" id="btn-print-kpi-cert" onclick="openKPICertificateModal()">
        <svg class="icon-inline" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="7"></circle>
          <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
        </svg>
        <span>Lihat Sertifikat</span>
      </button>
      <button type="button" class="btn-secondary-line" id="btn-request-kpi-crosscheck" onclick="openCrosscheckModal()">
        <svg class="icon-inline" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
        <span>Ajukan Croscheck</span>
      </button>
    </div>
  </div>
</div>
