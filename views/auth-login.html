<section id="section-login" class="login-page-container">
  <div class="login-center-box">
    
    <div class="login-brand-typography-hero">
      <h1 class="login-hero-title">My<span>aiwa</span></h1>
      <span class="login-hero-subtitle">AIWA RAGIN JAJE</span>
      <div class="login-hero-divider"></div>
    </div>

    <div class="card login-card-floating">
      <form id="form-login" class="form-center">
        <div class="form-group">
          <label>Email Karyawan</label>
          <input type="email" id="login-email" required placeholder="email@aiwaraginjaje.com" autocomplete="email">
        </div>
        
        <div class="form-group">
          <label>Password Akun</label>
          <div class="password-input-wrapper">
            <input type="password" id="login-password" required placeholder="********" autocomplete="current-password">
            <button type="button" class="btn-toggle-eye" id="btn-toggle-pass" onclick="togglePasswordVisibility()" aria-label="Lihat Password">
              <svg id="eye-icon-open" class="eye-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-icon-closed" class="eye-svg hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.45 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        
        <button type="submit" id="btn-login-submit" class="btn-primary btn-full mt-2">
          <span id="btn-login-text">Masuk Sistem</span>
          <div id="btn-login-spinner" class="ios-spinner spinner-sm hidden"></div>
        </button>
      </form>
    </div>
  </div>

  <div class="bottom-theme-segmented-switch-fixed">
    <button type="button" class="btn-segmented-pill active-theme" id="login-theme-light" onclick="switchGlobalTheme('light')">Light</button>
    <button type="button" class="btn-segmented-pill" id="login-theme-dark" onclick="switchGlobalTheme('dark')">Dark</button>
  </div>
</section>
