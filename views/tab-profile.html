<!-- ==========================================================================
     VIEWS/TAB-PROFILE.HTML - MENU PROFIL MODERN & MINIMALIS (CLEAN UI)
     MYAIWA - AIWA RAGIN JAJE SYSTEM
     ========================================================================== -->

<div id="tab-profile" class="tab-content hidden">
  <!-- 1. HERO HEADER PROFIL (CENTERED & THREADS-STYLE BADGE) -->
  <div class="card unified-hero-gradient-card mb-2 text-center" style="padding: 1.5rem 1rem; display: flex; flex-direction: column; align-items: center;">
    <div class="threads-avatar-container">
      <div class="profile-avatar-wrapper threads-avatar-frame">
        <img id="page-user-avatar" alt="" class="avatar-profile-main image-fade">
      </div>
      
      <!-- Threads-style Camera Badge Button -->
      <label for="input-avatar-file" class="threads-badge-action" title="Ganti Foto">
        <svg class="icon-inline" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </label>
      <input type="file" id="input-avatar-file" class="file-input-hidden" accept="image/*">
    </div>

    <div class="profile-text-header mt-1 text-center" style="width: 100%;">
      <strong id="page-user-name" class="hero-user-name" style="font-size: 1.15rem; display: block; text-align: center; margin-bottom: 2px;">Nama Pengguna</strong>
      <small id="page-user-email" style="font-size: 0.68rem; color: var(--text-secondary); font-weight: 600; display: block; text-align: center;">email@aiwaraginjaje.com</small>
    </div>
  </div>

  <!-- 2. PENGATURAN TEMA TAMPILAN -->
  <div class="card mb-2">
    <div class="sheet-section-title mb-2">
      <span class="text-uppercase-label font-700">Tampilan & Tema</span>
    </div>
    <div class="grid-2 gap-sm">
      <button type="button" id="profile-theme-light" class="btn-theme-segmented active-theme" onclick="switchGlobalTheme('light')">
        <svg class="icon-inline" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span>Terang</span>
      </button>
      <button type="button" id="profile-theme-dark" class="btn-theme-segmented" onclick="switchGlobalTheme('dark')">
        <svg class="icon-inline" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <span>Gelap</span>
      </button>
    </div>
  </div>

  <!-- 3. INFORMASI DATA DIRI & SUSUNAN TOMBOL AKSI -->
  <div class="card mb-2">
    <div class="sheet-section-title mb-2">
      <span class="text-uppercase-label font-700">Informasi Akun</span>
      <small class="text-danger font-600" style="font-size: 0.55rem;">* WAJIB DIISI</small>
    </div>

    <form id="form-update-profile">
      <div class="form-group mb-1">
        <label>NAMA LENGKAP</label>
        <input type="text" id="profile-full-name" required placeholder="Nama Lengkap">
      </div>
      <div class="form-group mb-1">
        <label>NOMOR WHATSAPP / HP</label>
        <input type="tel" id="profile-phone" required placeholder="0823XXXXXXXX">
      </div>
      <div class="form-group mb-3">
        <label>ALAMAT DOMISILI</label>
        <input type="text" id="profile-address" required placeholder="Alamat domisili lengkap">
      </div>

      <!-- BARIS 1: UBAH PASSWORD & UPDATE SISTEM SEJAJAR (GRID 2) -->
      <div class="grid-2 gap-sm mb-2">
        <button type="button" class="btn-profile-secondary" onclick="navigateToTab('change-pass')">
          <svg class="icon-inline" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span>Ubah Password</span>
        </button>

        <button type="button" class="btn-profile-secondary" onclick="forceUpdateAndClearCache()">
          <svg class="icon-inline" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span>Update Sistem</span>
        </button>
      </div>

      <!-- BARIS 2: SIMPAN SEMUA PENGATURAN (FULL WIDTH) -->
      <button type="submit" class="btn-primary btn-full mb-2" style="padding: 0.85rem; font-size: 0.82rem;">
        <span>Simpan Semua Pengaturan</span>
      </button>

      <!-- BARIS 3: KELUAR AKUN (FULL WIDTH SOFT RED) -->
      <button type="button" class="btn-logout-full" onclick="triggerLogout()">
        <svg class="icon-inline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span>Keluar Akun</span>
      </button>
    </form>
  </div>
</div>
