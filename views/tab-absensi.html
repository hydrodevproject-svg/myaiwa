<!-- ==========================================================================
     VIEWS/TAB-ABSENSI.HTML - PRESENSI GPS & RIWAYAT KEHADIRAN PRIBADI
     MYAIWA - AIWA RAGIN JAJE SYSTEM
     ========================================================================== -->

<div id="tab-absensi" class="tab-content hidden">
  <div class="card attendance-time-card">
    
    <!-- HEADER STATUS SHIFT & CEK GPS -->
    <div class="attendance-time-header">
      <span id="user-shift-mode-badge" class="badge-status-work">MEMUAT SHIFT...</span>
      <button type="button" class="btn-cek-gps" onclick="refreshMapLibreGPS()">
        <svg id="gps-icon-monotone" class="icon-inline" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a8 8 0 00-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 00-8-8zm0 11a3 3 0 110-6 3 3 0 010 6z"/>
        </svg>
        <div id="gps-spinner-monotone" class="ios-spinner spinner-xs hidden"></div>
        <span id="gps-btn-text">CEK GPS</span>
      </button>
    </div>

    <!-- PETA LOKASI MAPLIBRE -->
    <div id="maplibre-view" class="leaflet-map-box mb-2"></div>

    <!-- STATUS RADIUS GPS -->
    <div id="gps-radius-status-box" class="ahsan-radius-box mb-2">
      <div class="radius-icon">
        <svg class="icon-inline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="radius-text">
        <strong>MENENTUKAN RADIUS...</strong>
        <span>Tekan tombol 'CEK GPS' untuk mendeteksi posisi Anda.</span>
      </div>
    </div>

    <!-- STATISTIK JAM HARI INI -->
    <div class="grid-2 gap-sm mb-2">
      <div class="time-stat-pill">
        <small>Jam Check-In</small>
        <strong id="today-checkin-time">--:--</strong>
      </div>
      <div class="time-stat-pill">
        <small>Jam Check-Out</small>
        <strong id="today-checkout-time">--:--</strong>
      </div>
    </div>

    <!-- TOMBOL UTAMA CHECK-IN / CHECK-OUT -->
    <button type="button" id="btn-trigger-attendance" class="btn-primary btn-full btn-absen-large mb-2" onclick="executeGPSAttendance()">
      <span>Proses Absensi Masuk</span>
    </button>

    <!-- TOMBOL KAPSUL SAKIT (+) & IZIN -->
    <div class="grid-2 gap-sm">
      <button type="button" class="btn-sakit-custom" onclick="openLeaveFormPage('Sakit')">
        <svg class="icon-inline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>SAKIT</span>
      </button>

      <button type="button" class="btn-izin-custom" onclick="openLeaveFormPage('Izin')">
        <svg class="icon-inline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>IZIN</span>
      </button>
    </div>
  </div>

  <!-- RIWAYAT KEHADIRAN PRIBADI -->
  <div class="card">
    <div class="sheet-section-title mb-2">
      <span class="text-uppercase-label font-700">Riwayat Kehadiran Saya</span>
      <small id="attendance-count-badge">0 Hari Terakhir</small>
    </div>
    <div id="attendance-history-list" class="picker-list-scroll max-h-280">
      <p class="placeholder-text">Memuat riwayat kehadiran...</p>
    </div>
  </div>
</div>
