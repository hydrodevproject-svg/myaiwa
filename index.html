<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Myaiwa - AIWA RAGIN JAJE</title>
  
  <!-- PWA & MOBILE METADATA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a4b8b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- PRECONNECT MAP TILES CDN & GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin>

  <!-- STYLESHEET INTERNAL -->
  <link rel="stylesheet" href="./style.css">
  
  <!-- MAPLIBRE GL JS (PRESENSI GPS) -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <!-- UTILITY LIBRARIES -->
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer src="https://unpkg.com/html5-qrcode"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <!-- GLOBAL LOADER MINIMALIS (FLOATING SPINNER MELAYANG TANPA KOTAK & TEKS) -->
  <div id="global-loader" class="hidden">
    <div class="loading-spinner"></div>
  </div>

  <!-- HEADER ATAS -->
  <header id="main-header" class="hidden">
    <div class="header-brand">
      <div class="header-brand-text">
        <h1 id="header-brand-title">My<span>aiwa</span></h1>
        <span id="header-brand-subtitle" class="header-brand-sub">AIWA RAGIN JAJE</span>
      </div>
    </div>
    
    <div class="header-profile-pill" onclick="navigateToTab('profile')">
      <div class="avatar-circle-wrap">
        <img id="header-user-avatar" alt="" class="avatar-circle image-fade">
      </div>
      <div class="header-user-text">
        <strong id="header-user-name">Pengguna</strong>
        <small id="header-user-email">email@aiwaraginjaje.com</small>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- CONTAINER DINAMIS: AUTENTIKASI -->
    <div id="view-auth-login"></div>

    <!-- CONTAINER DINAMIS: DASHBOARD TABS -->
    <section id="section-dashboard" class="hidden">
      <div id="view-tab-beranda"></div>
      <div id="view-tab-tugas"></div>
      <div id="view-tab-absensi"></div>
      <div id="view-tab-gaji"></div>
      <div id="view-tab-kasbon"></div>
      <div id="view-tab-hr"></div>
      <div id="view-tab-accounting"></div>
      <div id="view-tab-users"></div>
      <div id="view-tab-it"></div>
      <div id="view-tab-profile"></div>
      <div id="view-sub-pages"></div>
    </section>
  </main>

  <!-- CONTAINER DINAMIS: MODAL OVERLAYS -->
  <div id="view-modals"></div>

  <!-- BOTTOM NAVIGATION -->
  <nav id="bottom-nav" class="bottom-nav hidden">
    <button class="nav-item active" onclick="navigateToTab('beranda')" id="nav-beranda">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      Beranda
    </button>
    <button class="nav-item" onclick="navigateToTab('profile')" id="nav-profile">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      Profil
    </button>
  </nav>

  <!-- ENTRY POINT JS -->
  <script type="module" src="./app.js"></script>
</body>
</html>
