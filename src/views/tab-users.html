<div id="tab-users" class="tab-content hidden">
  <div class="card">
    <h2>Recruitment & Pendaftaran Akun</h2>
    <form id="form-create-user" class="mt-3">
      <div class="form-group">
        <label>Nama Lengkap Karyawan</label>
        <input type="text" id="new-user-name" required placeholder="Contoh: Budi Staf">
      </div>
      <div class="form-group">
        <label>Email Karyawan</label>
        <input type="email" id="new-user-email" required placeholder="karyawan@aiwaraginjaje.com">
      </div>
      <div class="form-group">
        <label>Password Sementara</label>
        <input type="password" id="new-user-password" required placeholder="Minimal 6 karakter">
      </div>
      <div class="form-group">
        <label>Hak Akses (Role)</label>
        <select id="new-user-role" required>
          <option value="" disabled selected>-- Pilih Role Staf --</option>
          <option value="staff">Staff Outlet</option>
          <option value="admin">Staff Admin</option>
          <option value="logistik">Staff Logistik</option>
          <option value="it">Staff It</option>
          <option value="gm">gm</option>
        </select>
      </div>
      <button type="submit" class="btn-primary btn-full mt-2">Daftarkan Karyawan Baru</button>
    </form>
  </div>
</div>
